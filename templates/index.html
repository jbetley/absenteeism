// Download district level (attendance/chronic absenteeism or
// Title funding) data- depending on the currently selected tab-
// as a csv or (lightly) formatted excel file
async function downloadData(select, id) {

   const activeTab = document.querySelector(".tab.main.active").id;
   let keyOrder,
      passed,
      colNumericFormat,
      colsToAlignLeft,
      fileName;

   let colsToFormatNumeric = [];

   if (activeTab == "fundingTab") {
      passed = [select,"funding"];
   }
   else if (activeTab == "attendanceTab") {
      passed = [select,"attend"];
   }
   else if (activeTab == "analysisTab") {
      passed = [select,"analysis"];
   }
   else {
      console.error("No tab selected.")
      return
   }

   let downloadData;

   let data = await fetch(`${window.origin}/download`, {
      method: "POST",
         credentials: "include",
         cache: "no-cache",
         headers: {
            Accept: "application/json",
            "Content-Type": "application/json",
      },
      body:JSON.stringify(passed)})
      .then(response=>{
         if (response.ok) {
            return response.json()
         } else {
            alert("Network Error: Could not load data.")
         }
   });
   
   if (activeTab == "fundingTab") {

      keyOrder = [
         "State","State Full","District Name","NCES ID","Entity ID","Low Grade","High Grade",
         "Enrollment","Number Charter Schools","Number Public Schools","Address",
         "City","State","ZIP","Type","Fund Year"
      ];

      colNumericFormat = "#,##0";
      colsToAlignLeft = [2,3,11,12,13]
      fileName = "districts_title_funding";

      // Now we need to ID the funding cols by prefix, clean the strings, add
      // the strings to keyOrder, and then change the keys to match
      const replaceSubstrings = {
         "Fnd_": "",
         "and": "and "
      };
      const fndSubstring = "Fnd_";

      let allFndKeys = data.flatMap(obj => 
         Object.keys(obj).filter(key => key.includes(fndSubstring))
         );
      let fndKeys = [...new Set(allFndKeys)];

      let replaceKeys = fndKeys.map(str => str.replaceAll(fndSubstring, "").replaceAll("and", "and "));
      
      // and add spaces between words
      let cleanKeys = replaceKeys.map(str => str.replace(/([a-z])([A-Z])/g, '$1 $2'));
      const numKeys = cleanKeys.length;

      // once we've determined the # of funding headers, we can determine which
      // cols to format - starting with col 15
      const startCol = 15;
      let columnIdxs = [];
      for (let i = startCol; i <= (startCol + numKeys-1); i++) {
         columnIdxs.push(i);
      }
      // convert them to corresponding alphabet character (64 is the key offset:
      // in the ASCII table, uppercase 'A' is 65)
      colsToFormatNumeric = columnIdxs.map(num => String.fromCharCode((num+1) + 64));

      // add funding cols to master key order
      keyOrder.push(...cleanKeys);

      // Now modify the 'actual' object keys by making replacement and adding spaces
      // TODO: add this to existing 'replaceSubstringFromKeys' function?
      const replacePattern = new RegExp(Object.keys(replaceSubstrings).join("|"), "g");

      // Transform the data
      downloadData = data.map(obj => 
         Object.fromEntries(
            Object.entries(obj).map(([key, value]) => {
               // Replace substrings based on the dictionary lookup
               const newKey = key.replace(
                  replacePattern, matched => replaceSubstrings[matched]).replace(/([a-z])([A-Z])/g, '$1 $2'
               );
               return [newKey, value];
            })
         )
      );

   }
   else if (activeTab == "attendanceTab") {

      keyOrder = [
         "State", "Year", "District Name","Entity ID", "Attendance Rate",
         "Chronic Absenteeism"
      ];
      colsToFormatNumeric = ["E","F"];
      colNumericFormat = "0.00%";
      colsToAlignLeft = [2]
      fileName = "districts_attendance";

      downloadData = structuredClone(data);
   }
   else if (activeTab == "analysisTab") {
      console.log("DOWNLOGDSING ANALYSIS")
      // keyOrder = [
      //    "State", "Year", "District Name","Entity ID", "Attendance Rate",
      //    "Chronic Absenteeism"
      // ];
      // colsToFormatNumeric = ["E","F"];
      // colNumericFormat = "0.00%";
      // colsToAlignLeft = [2]
      // fileName = "districts_attendance";

      // downloadData = structuredClone(data);
}

   else {
      console.error("No tab selected.")
      return
      }

   // rename State Abbreviation
   const renameData = downloadData.map(({ ["State Abbreviation"]: State, ...rest }) => ({
      State,
      ...rest
   }));

   const reorderedData = reorderKeys(renameData, keyOrder);
   
   if (id == "csvButton") {
      const csv = convertArrayToCSV(reorderedData);
      downloadCSV(csv, fileName + ".csv");
   }
   else if (id == "excelButton") {

      // converts json to excel worksheet object
      let worksheet = XLSX.utils.json_to_sheet(reorderedData);
      
      // add empty sheetJS attribute for column formatting
      worksheet["!cols"] = [];

      let minWidth = 15;

      // format numerical column values
      for (let col of colsToFormatNumeric) {
         formatColumn(worksheet, col, colNumericFormat)
      };
      
      // Adjust with of column to greater of: max header length,
      // max property length, or minimum width
      for (let i = 0; i < keyOrder.length; ++i) {
         let headerWidth = keyOrder[i].length + 5;
         let maxValueWidth = findMaxValueLength(reorderedData, keyOrder[i]) + 5;

         let colWidth = Math.max(minWidth, maxValueWidth, headerWidth);

         // 'wch" is inner width in MDW
         if(!worksheet["!cols"][i]) worksheet["!cols"][i] = {wch: 3};
         worksheet["!cols"][i].width = colWidth;
      };

      // sheet styling (https://gitbrent.github.io/xlsx-js-style/)
      var range = XLSX.utils.decode_range(worksheet['!ref']);

      // format headers - font, bold, etc.
      for (let colNum = range.s.c; colNum <= range.e.c; colNum++) {
         const cellAddress = XLSX.utils.encode_cell({ r: 0, c: colNum });
         if (cellAddress) {
            worksheet[cellAddress].s = {
               font: {
                  name: "Calibri",
                  sz: 11,
                  bold: true,
                  color: { rgb: "000000" },
                  },
               alignment: {
                  vertical: "center",
                  horizontal: "center"
               }
            }
         };

         // Center rows- skipping defined (colsAlignToLeft) columns
         for (let rowNum = range.s.r; rowNum <= range.e.r; rowNum++) {
            if (rowNum != 0) {
               if (!colsToAlignLeft.includes(colNum)) {
                  const cellAddress = XLSX.utils.encode_cell({ r: rowNum, c: colNum });
                  if (cellAddress) {
                     worksheet[cellAddress].s = {
                        alignment: {
                           vertical: "center",
                           horizontal: "center"
                        }
                     }
                  }
               }
            }
         };
      };
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Districts");
      XLSX.writeFile(workbook, fileName + ".xlsx", { compression: true });
   }
   else {
      console.error("No button selected.")
      return
   }
};


// populate state dropdown
async function setStateList() {

   let uniqueStates = [...new Map(allStatesFundingObj.map(
      item => [item["State Abbreviation"], item]
   )).values()];

   // remove territories and Bureau of Indian affairs - want to
   // leave them in the data just in case
   const removeStates = ['BI', 'GU', 'VI', 'PR', 'MP'];
   uniqueStates = uniqueStates.filter(obj => !removeStates.includes(obj["State Abbreviation"]));

   let stateDropdown = uniqueStates.map(
      el => ({[el["State Abbreviation"]]: el["State Full"]})
   );

   stateDropdown.sort(function(a, b) { 
      return Object.values(a)[0].localeCompare(Object.values(b)[0])
   }); // swap a & b for reverse sort

   removeOptions(stateSelection);

   stateDropdown.forEach(obj => {
      Object.entries(obj).forEach(([key, value]) => {
         stateSelection.appendChild(new Option(value, key));
      });
   });
   setDistrictList();
};


// populate district dropdown
async function setDistrictList() {

   let sortVal, districtList;

   const activeTab = document.querySelector(".tab.main.active").id;

   let stateAcademicDistricts = allStatesAcademicObj.filter(
         val => val["State Abbreviation"].includes(stateSelection.value)
      );

   let stateFundingDistricts = allStatesFundingObj.filter(
      val => val["State Abbreviation"].includes(stateSelection.value)
   );

   // if stateAcademicDistricts is <= 1 it means that the only record in
   // stateAcademicDistricts is "State Average" - so we want to continue
   // to use the FundingDistricts list for the district Dropdown - "State
   // Average" is not a clickable link.
   if (activeTab == "attendanceTab" && stateAcademicDistricts.length > 1) {
      districtList = stateAcademicDistricts;
      sortVal = "Attendance Rate";
   } else {
      districtList = stateFundingDistricts;
      sortVal = "Title I";
   }

   // NOTE: we want list sorted alphabetically, except for the default
   // displayed district, which we want to be the school with the highest
   // Title I Allocation or Attendance Rate
   let sortedDistricts = sortObjectsByNumberWithBlanksToEnd(districtList, sortVal);

   const highest = sortedDistricts.shift();

   sortedDistricts.sort(
      (a, b) => a["District Name"].toLowerCase() > 
         b["District Name"].toLowerCase() ? 1 : -1
   );

   // display is Name, but key is ID
   const districtObj = sortedDistricts.map(obj => ({
       name: obj["District Name"],
       id: obj["Entity ID"]
      }));

   // a different way to get unique values (see setStateList)
   let districtDropdown = Array.from(
      new Set(districtObj.map(o => JSON.stringify(o)))).map(str => JSON.parse(str)
   );

   // add district with highest Title I value to top of array
   districtDropdown.splice(0, 0, {
      name: highest["District Name"],
      id: highest["Entity ID"]
   });

   // clear existing options
   removeOptions(districtSelection);

   const allDistricts = { name: '-- All Schools --', id: '0' };

   districtDropdown.unshift(allDistricts);

   districtDropdown.forEach(
      (obj) => districtSelection
      .appendChild(new Option(obj.name, obj.id))
   );
};

function createAgTable(tableData, tableID) {

   // because we don't know what the fund titles will be, we
   // need to mark them with the Fnd_ prefix for identification,
   // but not display purposes.
   const fndSubstring='Fnd_';

   let allFndKeys = tableData.flatMap(obj => 
      Object.keys(obj).filter(key => key.includes(fndSubstring))
      );
   let fndKeys = [...new Set(allFndKeys)];

   let keys = Object.keys(tableData.reduce(function(result, obj) {
      return Object.assign(result, obj);
   }, {}));

   let yearKeys = [];

   let totalCol = keys.filter(item => item.includes("Total"));

   // get keys (columns) in correct order
   if (tableID == "attendanceTable") {

      // get list of years and sort descending
      const infoCols = ["District Name", "Entity ID"]

      yearKeys = keys.filter(item => !infoCols.includes(item));

      // We only want to display 3 years at a time
      if (yearKeys.length >= 4) {
         let numToRemove = yearKeys.length - 3
         yearKeys.splice(0, numToRemove)

      }
      yearKeys.sort()
      yearKeys.reverse()
      keys = infoCols.concat(yearKeys)
   }
   else if (tableID == "fundingTable") {

      keys = keys.filter(item => item != "District Name");
      keys.unshift("District Name")

      // Ensure "Total" col is in the 4th position in the list
      const highLightIdx = keys.indexOf(totalCol[0]);

      if (highLightIdx !== -1) {
         keys.splice(highLightIdx, 1); // Remove 1 element at the found index
         keys.splice(3, 0, totalCol[0]);
      }

   } else if (tableID == "absenteeismDiffTable") {
      keys = [
         'District Name', 'Absenteeism', 'Increase', totalCol[0]
      ];
   } else if (tableID == "absenteeismSliceTable") {
      console.log("YOOOO")
      console.log(tableData)
      keys = [
         'District Name', 'Absenteeism', 'Change from Previous Year', totalCol[0]
      ];
   } else if (tableID == "attendanceDiffTable") {
            keys = [
         'District Name', 'Attendance', 'Increase', totalCol[0]
      ];
   } else if (tableID == "attendanceSliceTable") {
      keys = [
         'District Name', 'Attendance', 'CHange from Previous Year', , totalCol[0]
      ];
   }

   let columns = keys.map(field => ({field}));

   columns.forEach(function(e) {
      
      if (e.field == "District Name") {
         e.valueFormatter = "";
         e.resizable = false;
         e.autoHeight = true;
         e.wrapText = true;
         e.minWidth = 125;
         e.maxWidth = 125;
         e.cellClass = "ag-left-aligned-cell";
         e.headerClass = "text-center";
      } else if (e.field == "Entity ID") {
         e.valueFormatter = blankFormatter;
         e.flex = 1;
         e.resizable = false;
         e.minWidth = 75;
         e.maxWidth = 75;
         e.cellClass = "ag-center-aligned-cell";
         e.headerClass = "text-center";
         e.headerName = "ID"
      } else if (e.field == "Fund Year") {
         e.valueFormatter = blankFormatter;
         e.flex = 1;
         e.resizable = false;
         e.maxWidth = 75;
         e.minWidth = 75;
         e.cellClass = "ag-center-aligned-cell";
         e.headerClass = "text-center";
         e.headerName = "Year"
      } 
      else if (
         yearKeys.includes(e.field) || 
         e.field == "Increase" ||
         e.field == "Decrease" ||
         e.field == "Absenteeism" ||
         e.field == "Attendance"
      ) {

         let header;

         if (e.field == "Absenteeism" || e.field == "Attendance") {
            header = e.field + " (" + String(tableData[0].Year) + ")";
         } else {
            header = e.field;
         }
         if (e.field == "Increase" || e.field == "Decrease") {
            e.cellStyle = params => {
               if (params.value < 0) {
                  return { color: 'red' };
               }
               if (params.value > 0) {
                  return { color: 'green' };
               }
               return null;
            };
         }

   }
   // 'data' is not empty (could have AT, CA, or both)
   else {
      
      let attendanceCols = ["Entity ID", "District Name", "Year", "Attendance Rate"];
      let attendanceFiltered = filterObj(data, attendanceCols);

      let attendanceData = attendanceFiltered.filter( obj => (
         obj["Attendance Rate"] !== "" &&
         obj["Attendance Rate"] !== undefined &&
         typeof obj["Attendance Rate"] !== 'undefined'
         )
      );

      // TODO: Check to see if we need this for attendance

      // here as well

      // if (attendanceCheck == undefined || hasSameKeyValue(attendanceFiltered, "Entity ID", "99999")) {

      if (!Array.isArray(attendanceData) || !attendanceData.length) {

      // there is AT data in attendanceData
      } else {

         // drop the State Average (Entity ID: 99999) from attendance rate data
         // (we only collect chronic absenteeism at state level)
         // let attendanceCleaned = attendanceWithAvalues.filter(
         //    item => item["Entity ID"] !== "99999"
         // ); 

         // Change "Attendance Rate" key to the applicable Year
         let attendanceRenamed = replaceKeyWithValue(attendanceData, 'Year', 'Attendance Rate');

         // merge all years on ID
         let attendanceMerged = mergeObjectsWithSameValue(attendanceRenamed, "Entity ID");
         
         const yearCols = getYearList(attendanceMerged);
         const removeCols = yearCols.slice(0, 2);

         // remove rows if the two most recent years are 0, null, or undefined
         let attendanceCleaned = attendanceMerged.filter(obj => {
            const isEmpty = val => val === 0 || val === null || val === undefined;
            return !(isEmpty(obj[removeCols[0]]) && isEmpty(obj[removeCols[1]]));
         });

         // sort the table by the values of the most recent year of data
         let attendanceSorted = sortObjectsByNumberWithBlanksToEnd(attendanceCleaned,yearCols[0]);

         let attendanceTableOptions = createAgTable(attendanceSorted, "attendanceTable");

         if (!displayAttendanceTables.attendanceInit) {

               );

         else {

               "columnDefs", attendanceTableOptions.columnDefs
            );

         }      
      };

      let absenteeismCols = ["Entity ID", "District Name", "Year", "Chronic Absenteeism"];
      let absenteeismFiltered = filterObj(data, absenteeismCols);

      // filter for absenteeism data
      let absenteeismData = absenteeismFiltered.filter( obj => (
         obj["Chronic Absenteeism"] !== "" &&
         obj["Chronic Absenteeism"] !== undefined &&
         typeof obj["Chronic Absenteeism"] !== 'undefined'
         )
      );

      // absenteeismData is empty
      if (!Array.isArray(absenteeismData) || !absenteeismData.length) {

         // create absenteeism table if it does not exist
         if (absenteeismGridApi == undefined) {

            const absenteeismTableGridDiv = document.querySelector("#absenteeismTable");

            emptyTableOptions.gridId = 'absenteeismTable';
            
            absenteeismGridApi = agGrid.createGrid(

               );

         // empty table
         } else {
            attendanceGridApi.setGridOption('columnDefs', []);
            absenteeismGridApi.setGridOption("rowData", []);
            absenteeismGridApi.showNoRowsOverlay();
         }

      // absenteeismData is not empty
      } else {

         let absenteeismRenamed = replaceKeyWithValue(
            absenteeismData, 'Year', 'Chronic Absenteeism'
         );

         let absenteeismMerged = mergeObjectsWithSameValue(
            absenteeismRenamed, "Entity ID"
         );

         const yearCols = getYearList(absenteeismMerged);
         const removeCols = yearCols.slice(0, 2);

         let cleanedData = absenteeismMerged.filter(obj => {
            const isEmpty = val => val === 0 || val === null || val === undefined;
            return !(isEmpty(obj[removeCols[0]]) && isEmpty(obj[removeCols[1]]));
         });

         let absenteeismCleaned = cleanedData.filter(obj => 
            !yearCols.every(key => obj[key] === 0)
         );

         let absenteeismSorted = sortObjectsByNumberWithBlanksToEnd(
            absenteeismCleaned,yearCols[0]
         );

         let absenteeismTableOptions = createAgTable(
            absenteeismSorted, "attendanceTable"
         );

         if (!displayAttendanceTables.absenteeismInit) {
            
            const absenteeismTableGridDiv = document.querySelector("#absenteeismTable");

            absenteeismGridApi = agGrid.createGrid(
               absenteeismTableGridDiv, absenteeismTableOptions
               );

            displayAttendanceTables.absenteeismInit = true;
            
         }
         else {
            absenteeismGridApi.setGridOption(
               "columnDefs", absenteeismTableOptions.columnDefs
            );
            absenteeismGridApi.setGridOption("rowData", absenteeismSorted);
         }
      }
   }
};


/* Initialize */
if (document.readyState !== "loading") {
   await setStateList();
   await getStateData(stateSelection.value);
   await getSingleDistrictData(stateSelection.value, districtSelection.value);
   await getAllDistrictData(stateSelection.value, districtSelection.value);
};

</script>
